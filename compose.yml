services:
  # Base de données MySQL
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ${MYSQL_DATA_DIR}:/var/lib/mysql
      - ${LOG_DIR_MYSQL}:/var/log/mysql
      - ${ MYSQL_DUMP_DIR }/script.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-net
    healthcheck:
      test: [ "CMD-SHELL", "mysql -u ${MYSQL_USER} -p${MYSQL_ROOT_PASSWORD} -e 'SELECT 1 FROM springboot.user LIMIT 1;' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5


  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${PMA_PORT:-9005}:80"
    depends_on:
      - mysql
    networks:
      - backend-net


  # API Spring Boot
  api:
    image: ${API_IMAGE_NAME}
    container_name: spring-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/springboot}
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:-root}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:-root}"
    ports:
      - "${API_PORT:-9090}:9090"
    networks:
      - backend-net
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/persons || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Application Web
  web:
    image: ${WEB_IMAGE_NAME}
    container_name: webdemo-app
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:9090
    ports:
      - "${WEB_PORT:-9092}:9001"
    networks:
      - frontend-net


volumes:
  mysql-data:
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge